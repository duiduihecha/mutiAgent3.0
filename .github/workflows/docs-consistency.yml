name: docs-consistency

# 文档-代码一致性校验：防止 paper_assets / README 与实际代码/数据脱节
# 触发：push、PR 到主分支，或手动 dispatch
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run doc-consistency checker
        run: python3 scripts/check_doc_consistency.py

      - name: Fail if mismatch
        run: |
          # 校验器自身在发现脱节时打印 "结论: 存在脱节" 但退出码仍为 0
          # 这里显式捕获，确保 CI 在脱节时失败
          python3 scripts/check_doc_consistency.py | tee /tmp/out.txt
          grep -q "结论: 一致" /tmp/out.txt || { echo "::error::文档与代码/数据不一致，请运行 pnpm check:docs 排查"; exit 1; }
